<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YouTube Lyrics — Verified Extractor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h2>YouTube Lyrics</h2>

    <label for="apiKey">Gemini API Key</label>
    <input id="apiKey" type="password" placeholder="Paste your Gemini API key" />

    <label for="model">Gemini Model</label>
    <input id="model" type="text" value="gemini-3.1-flash-lite" />

    <div class="buttons">
      <button id="btnSaveSettings">Save Settings</button>
      <button id="btnTestApi">Test API</button>
    </div>

    <hr />

    <label for="title">Song Title</label>
    <input id="title" type="text" placeholder="Auto-filled from YouTube when possible" />

    <div class="buttons">
      <button id="btnGet">Get Verified Lyrics</button>
      <button id="btnClear">Clear Cache</button>
    </div>

    <p id="status"></p>
    <pre id="lyrics"></pre>

    <p class="hint">
      Default model is optimized for free-tier availability. Extension auto-fallbacks if needed.
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
