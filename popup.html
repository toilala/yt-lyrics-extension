<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>YouTube Lyrics</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h2>YouTube Lyrics</h2>

    <label>Backend URL</label>
    <input id="backendUrl" type="text" placeholder="https://yt-lyrics-extension.onrender.com" />
    <div class="row">
      <button id="saveSettings">Save</button>
      <button id="testBackend">Test</button>
    </div>

    <hr />

    <label>Detected Song Title</label>
    <input id="title" type="text" />

    <div class="row">
      <button id="getLyrics">Get Lyrics</button>
      <button id="clearCache">Clear Cache</button>
    </div>

    <p id="status"></p>
    <pre id="lyrics"></pre>
  </div>
  <script src="popup.js"></script>
</body>
</html>
